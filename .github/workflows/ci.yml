name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Sentinel (checksum and GPG verified)
        run: make tools

      - name: Format check and tests
        run: make ci

  vault-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # hashicorp/setup-terraform v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e

      - name: Terraform validate
        run: |
          for dir in vault/*/terraform; do
            echo "== ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false
            terraform -chdir="${dir}" validate
          done
